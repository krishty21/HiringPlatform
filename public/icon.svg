<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4c9e"/>
      <stop offset="1" stop-color="#003a7f"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (maskable-safe: fills entire canvas) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- Devanagari Shra (श्र) brand mark — inside central safe circle -->
  <text x="256" y="272" font-family="'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', sans-serif" font-size="200" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">श्र</text>
  <!-- Saffron bridge arc: the "Setu" (bridge) motif -->
  <path d="M 118 366 A 138 120 0 0 1 394 366" fill="none" stroke="url(#arc)" stroke-width="24" stroke-linecap="round"/>
  <!-- Bridge deck line -->
  <line x1="128" y1="398" x2="384" y2="398" stroke="#f5a623" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
</svg>
